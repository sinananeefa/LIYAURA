{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LIYAURA</title>
    <!-- Bootstrap CSS for grid utilities if needed -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Glassmorphic Login Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="login-page">
        <!-- Floating background glowing blobs for Glassmorphism highlight -->
        <div class="bg-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <!-- Glassmorphic Login Form Card -->
        <div class="form-container">
            <a class="brand" href="{% url 'user_landing' %}">LIYAURA</a>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to continue your journey</p>

            <!-- Error and Success Messages -->
            {% if messages %}
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Login Form -->
            <form method="POST" id="userLoginForm">
                {% csrf_token %}
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="field-toggle-icon" id="userPassToggle" title="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="userPassIcon"></i>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="mt-3" id="userSignInBtn">Sign In</button>
            </form>

            <div class="divider"><span>LIYAURA</span></div>
            <p class="switch-text">Don't have an account? <a href="{% url 'user_register' %}">Create one</a></p>
        </div>
    </main>

    <script>
        // Password Visibility Toggle Logic
        const userPassToggle = document.getElementById('userPassToggle');
        const userPassInput = document.getElementById('password');
        const userPassIcon = document.getElementById('userPassIcon');

        if (userPassToggle && userPassInput && userPassIcon) {
            userPassToggle.addEventListener('click', function () {
                const isPassword = userPassInput.type === 'password';
                userPassInput.type = isPassword ? 'text' : 'password';
                userPassIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            });
        }

        // Button Loading State Logic on Form Submission
        const userLoginForm = document.getElementById('userLoginForm');
        const userSignInBtn = document.getElementById('userSignInBtn');
        if (userLoginForm && userSignInBtn) {
            userLoginForm.addEventListener('submit', function () {
                userSignInBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing In...`;
                userSignInBtn.style.opacity = '0.9';
                userSignInBtn.style.pointerEvents = 'none';
            });
        }
    </script>
</body>
</html>
