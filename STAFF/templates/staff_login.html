{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | LIYAURA</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Glassmorphic Login Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="login-page">
        <!-- Floating background glowing blobs for Glassmorphism highlight -->
        <div class="bg-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <!-- Glassmorphic Login Form Card -->
        <section class="form-container">
            <p class="brand">LIYAURA</p>
            <h1>Staff Login</h1>
            <p class="subtitle">Wedding Rental Boutique</p>

            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}

            <form method="POST" id="staffLoginForm">
                {% csrf_token %}

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="field-toggle-icon" id="staffPassToggle" title="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="staffPassIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="mt-3" id="staffSignInBtn">Sign In</button>
            </form>

            <div class="divider"><span>LIYAURA STAFF PORTAL</span></div>
        </section>
    </main>

    <script>
        // Password Visibility Toggle Logic
        const staffPassToggle = document.getElementById('staffPassToggle');
        const staffPassInput = document.getElementById('password');
        const staffPassIcon = document.getElementById('staffPassIcon');

        if (staffPassToggle && staffPassInput && staffPassIcon) {
            staffPassToggle.addEventListener('click', function () {
                const isPassword = staffPassInput.type === 'password';
                staffPassInput.type = isPassword ? 'text' : 'password';
                staffPassIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            });
        }

        // Button Loading State Logic on Form Submission
        const staffLoginForm = document.getElementById('staffLoginForm');
        const staffSignInBtn = document.getElementById('staffSignInBtn');
        if (staffLoginForm && staffSignInBtn) {
            staffLoginForm.addEventListener('submit', function () {
                staffSignInBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing In...`;
                staffSignInBtn.style.opacity = '0.9';
                staffSignInBtn.style.pointerEvents = 'none';
            });
        }
    </script>
</body>
</html>
