{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIYAURA &middot; Owner Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(216, 195, 165, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(185, 151, 91, 0.18) 0%, transparent 40%),
                        #F7F4EE;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border: 1px solid rgba(33, 28, 24, 0.09);
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 20px 60px rgba(33, 28, 24, 0.08);
            text-align: center;
        }
        .auth-brand-monogram {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #967840, #B9975B);
            color: #FFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(185, 151, 91, 0.35);
        }
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #211C18;
            margin-bottom: 6px;
        }
        .auth-subtitle {
            font-size: 13px;
            color: #8D847A;
            margin-bottom: 30px;
        }
        .message-alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .message-alert.error { background: rgba(211, 47, 47, 0.1); color: #C62828; }
        .message-alert.success { background: rgba(46, 125, 50, 0.1); color: #2E7D32; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand-monogram">L</div>
        <h1 class="auth-title">LIYAURA</h1>
        <p class="auth-subtitle">Create Owner / Admin Account</p>

        {% for message in messages %}
            <div class="message-alert {{ message.tags }}">{{ message }}</div>
        {% endfor %}

        <form method="POST" style="text-align:left; display:flex; flex-direction:column; gap:16px;">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Choose password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary-luxury" style="justify-content:center; padding:12px; margin-top:8px; width:100%; border-radius:12px; font-size:14.5px;">
                <i class="fa-solid fa-user-plus"></i>
                <span>Register Admin</span>
            </button>
        </form>

        <div style="margin-top:28px; padding-top:20px; border-top:1px solid rgba(33, 28, 24, 0.08); font-size:12.5px; color:#8D847A;">
            Already have an account? <a href="{% url 'owner_login' %}" style="color:#B9975B; font-weight:600;">Sign In</a>
        </div>
    </div>
</body>
</html>
