{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIYAURA &middot; Owner Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --auth-bg: #0c0603;
            --auth-card: rgba(20, 12, 7, 0.45);
            --auth-dark: #fffaf2;
            --auth-gold: #f4d59c;
            --auth-gold-light: #e9d3b2;
            --auth-muted: rgba(244, 213, 156, 0.7);
            --auth-border: rgba(244, 213, 156, 0.25);
            --font-heading: 'Playfair Display', Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 50% 50%, rgba(26, 15, 8, 0.6), rgba(12, 6, 3, 0.95)),
                url("{% static 'images/landing-bg.jpg' %}") center / cover no-repeat;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient interactive floating lights */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 213, 156, 0.12), transparent 70%);
            pointer-events: none;
            transition: transform 0.15s ease-out;
            z-index: 1;
        }

        /* Background glowing blobs */
        .bg-blobs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatBlob 24s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: 10%;
            left: 15%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(244, 213, 156, 0.4) 0%, transparent 70%);
        }

        .blob-2 {
            bottom: 15%;
            right: 10%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(168, 109, 64, 0.45) 0%, transparent 70%);
            animation-delay: -6s;
            animation-duration: 28s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -50px) scale(1.15); }
            100% { transform: translate(-40px, 70px) scale(0.9); }
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            animation: authCardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes authCardEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-card {
            background: var(--auth-card);
            border: 1px solid var(--auth-border);
            border-radius: 28px;
            padding: 46px 42px;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.65), 
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 0 15px rgba(244, 213, 156, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #dcb062 50%, transparent 100%);
        }

        .auth-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-to-store {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--auth-muted);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .back-to-store:hover {
            color: #ffffff;
            transform: translateX(-3px);
        }

        .auth-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--auth-gold);
            background: rgba(244, 213, 156, 0.12);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(244, 213, 156, 0.15);
        }

        .auth-monogram {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: linear-gradient(135deg, #dcb062, #a86d40 55%, #8a522c);
            color: #1a0f07;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(168, 109, 64, 0.35);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-card:hover .auth-monogram {
            transform: scale(1.06) rotate(-2deg);
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 700;
            color: #fffaf2;
            margin: 0 0 6px;
            letter-spacing: 0.08em;
            text-shadow: 0 0 20px rgba(244, 213, 156, 0.3);
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--auth-gold-light);
            margin: 0 0 28px;
            opacity: 0.85;
        }

        .message-alert {
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            margin-bottom: 22px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .message-alert.error { 
            background: rgba(180, 60, 50, 0.25); 
            color: #ff9e90; 
            border: 1px solid rgba(180, 60, 50, 0.4); 
        }
        .message-alert.success { 
            background: rgba(70, 150, 90, 0.25); 
            color: #a3ffd0; 
            border: 1px solid rgba(70, 150, 90, 0.4); 
        }

        /* Interactive Floating Inputs */
        .interactive-field {
            position: relative;
            text-align: left;
            margin-bottom: 20px;
        }

        .interactive-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--auth-muted);
            margin-bottom: 8px;
            transition: color 0.25s ease;
        }

        .interactive-field:focus-within .interactive-label {
            color: var(--auth-gold);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 16px;
            color: var(--auth-muted);
            font-size: 14px;
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .interactive-field:focus-within .field-icon {
            color: var(--auth-gold);
            transform: scale(1.1);
        }

        .interactive-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 16px 14px 44px;
            color: #fffaf2;
            font-size: 14.5px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .interactive-input::placeholder {
            color: rgba(255, 244, 223, 0.4);
        }

        .interactive-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--auth-gold);
            box-shadow: 0 0 0 4px rgba(244, 213, 156, 0.15);
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            color: var(--auth-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            font-size: 14px;
            transition: color 0.2s ease;
            z-index: 5;
        }

        .password-toggle-btn:hover {
            color: #ffffff;
        }

        /* Demo Helper Pill */
        .demo-credentials-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(244, 213, 156, 0.06);
            border: 1px dashed rgba(244, 213, 156, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 22px;
            font-size: 12px;
            color: #fffaf2;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .demo-credentials-pill:hover {
            background: rgba(244, 213, 156, 0.12);
            border-color: var(--auth-gold);
            transform: translateY(-1px);
        }

        .demo-btn-action {
            background: linear-gradient(135deg, #dcb062, #a86d40);
            color: #1a0f07;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(168, 109, 64, 0.2);
        }

        /* Submit Button */
        .auth-submit-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #dcb062, #a86d40 55%, #8a522c);
            color: #1a0f07;
            padding: 15px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(168, 109, 64, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .auth-submit-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -90%;
            width: 50%;
            height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: skewX(-25deg);
            transition: left 0.75s ease;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(168, 109, 64, 0.5);
        }

        .auth-submit-btn:hover::after {
            left: 130%;
        }

        .auth-submit-btn:active {
            transform: translateY(0);
        }

        .auth-footer-links {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid rgba(244, 213, 156, 0.2);
            font-size: 13.5px;
            color: var(--auth-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .auth-link {
            color: var(--auth-gold);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease, letter-spacing 0.25s ease;
        }

        .auth-link:hover {
            color: #fffaf2;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- Floating background glowing blobs for Glassmorphism highlight -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header-top">
                <a href="{% url 'user_landing' %}" class="back-to-store" title="Go to customer site">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Customer Store</span>
                </a>
                <span class="auth-badge">Owner Gateway</span>
            </div>

            <div class="auth-monogram">L</div>
            <h1 class="auth-title">LIYAURA</h1>
            <p class="auth-subtitle">Executive Business Control Center</p>

            {% for message in messages %}
                <div class="message-alert {{ message.tags }}">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}

            <!-- Interactive One-Click Demo Credentials -->
            <div class="demo-credentials-pill" id="demoFillBtn" title="Click to auto-fill owner credentials">
                <div>
                    <strong>Owner Demo Login:</strong>
                    <div style="color:var(--auth-muted); font-size:11.5px; margin-top:2px;">User: <code>sinan7070</code> &middot; Pass: <code>12345678</code></div>
                </div>
                <span class="demo-btn-action">Auto-Fill</span>
            </div>

            <form method="POST" id="ownerLoginForm" style="text-align:left;">
                {% csrf_token %}
                
                <div class="interactive-field">
                    <label class="interactive-label" for="username">Username</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user field-icon"></i>
                        <input type="text" class="interactive-input" id="username" name="username" placeholder="Enter owner username" required autocomplete="username">
                    </div>
                </div>

                <div class="interactive-field">
                    <label class="interactive-label" for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" class="interactive-input" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="submitBtn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Sign In to Dashboard</span>
                </button>
            </form>

            <div class="auth-footer-links">
                <span>New Administrator?</span>
                <a href="{% url 'owner_register' %}" class="auth-link">Create Account &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        // Interactive Mouse Ambient Glow Follower
        const ambientGlow = document.getElementById('ambientGlow');
        document.addEventListener('mousemove', function (e) {
            if (ambientGlow) {
                const x = e.clientX - 250;
                const y = e.clientY - 250;
                ambientGlow.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Interactive Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const passwordToggleBtn = document.getElementById('passwordToggleBtn');
        const passwordToggleIcon = document.getElementById('passwordToggleIcon');

        if (passwordToggleBtn && passwordInput && passwordToggleIcon) {
            passwordToggleBtn.addEventListener('click', function () {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                passwordToggleIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            });
        }

        // Interactive Demo Auto-Fill
        const demoFillBtn = document.getElementById('demoFillBtn');
        const usernameInput = document.getElementById('username');
        if (demoFillBtn && usernameInput && passwordInput) {
            demoFillBtn.addEventListener('click', function () {
                usernameInput.value = 'sinan7070';
                passwordInput.value = '12345678';
                usernameInput.focus();
                demoFillBtn.style.borderColor = '#2E7D32';
                demoFillBtn.querySelector('.demo-btn-action').innerText = 'Filled ✓';
                demoFillBtn.querySelector('.demo-btn-action').style.background = '#2E7D32';
            });
        }

        // Interactive Submit Button Animation
        const loginForm = document.getElementById('ownerLoginForm');
        const submitBtn = document.getElementById('submitBtn');
        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', function () {
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying Credentials...</span>`;
                submitBtn.style.opacity = '0.9';
                submitBtn.style.pointerEvents = 'none';
            });
        }
    </script>
</body>
</html>
